name: Tic Tac Toe Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'play:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Turn
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python play.py

      - name: Commit and Push Board Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matrix.json README.md
          git commit -m "System: Processed turn via issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close Issue Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"
